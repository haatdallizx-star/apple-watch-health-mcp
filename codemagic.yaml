workflows:
  ios-workflow:
    name: iOS Archive
    instance_type: mac_mini_m2
    max_build_duration: 60

    environment:
      xcode: latest
      vars:
        XCODE_PROJECT: "ios/WatchHealthTest.xcodeproj"
        XCODE_SCHEME: "WatchHealthTest"
        ARCHIVE_PATH: "$CM_BUILD_DIR/build/WatchHealthTest.xcarchive"

    scripts:
      - name: Archive iOS and Watch apps
        script: |
          set -euo pipefail

          rm -rf "$CM_BUILD_DIR/build"
          mkdir -p "$CM_BUILD_DIR/build"

          xcodebuild archive \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$ARCHIVE_PATH" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package unsigned IPA for AltStore
        script: |
          set -euo pipefail

          APP_PATH=$(find "$ARCHIVE_PATH/Products/Applications" \
            -maxdepth 1 -type d -name "*.app" -print -quit)

          if [ -z "$APP_PATH" ]; then
            echo "No iOS app was found in the archive."
            exit 1
          fi

          PACKAGE_DIR="$CM_BUILD_DIR/build/ipa"
          mkdir -p "$PACKAGE_DIR/Payload"
          /usr/bin/ditto "$APP_PATH" "$PACKAGE_DIR/Payload/$(basename "$APP_PATH")"

          cd "$PACKAGE_DIR"
          /usr/bin/ditto -c -k --sequesterRsrc --keepParent \
            Payload "$CM_BUILD_DIR/build/WatchHealthTest-unsigned.ipa"

          /usr/bin/unzip -t "$CM_BUILD_DIR/build/WatchHealthTest-unsigned.ipa"

    artifacts:
      - build/WatchHealthTest-unsigned.ipa
      - build/WatchHealthTest.xcarchive
