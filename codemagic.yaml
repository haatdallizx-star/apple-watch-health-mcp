workflows:
  ios-workflow:
    name: iOS Build
    instance_type: mac_mini_m2
    max_build_duration: 60

    environment:
      xcode: latest

    scripts:
      - name: Build iOS app
        script: |
          xcodebuild \
            -project ios/WatchHealthTest.xcodeproj \
            -scheme "WatchHealthTest" \
            -configuration Debug \
            -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO
            build
